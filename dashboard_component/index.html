<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lebanon Industrial Export Dashboard</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#f6f1e8; }
    #loading { position:absolute; inset:0; display:grid; place-items:center; font:600 14px Arial,sans-serif; color:#1f2d45; background:#f6f1e8; z-index:2; }
    #dashboard { display:block; width:100%; height:100%; border:0; background:#f6f1e8; }
  </style>
</head>
<body>
  <div id="loading">Loading dashboard…</div>
  <iframe id="dashboard" src="./dashboard.html" title="Lebanon Industrial Export Dashboard" scrolling="yes"></iframe>
  <script>
  (() => {
    const READY = "streamlit:componentReady";
    const RENDER = "streamlit:render";
    const SET_HEIGHT = "streamlit:setFrameHeight";
    const iframe = document.getElementById("dashboard");
    const loading = document.getElementById("loading");
    let requestedHeight = 920;
    let applying = false;
    let headerObserver = null;

    const send = (type, data={}) => window.parent.postMessage({isStreamlitMessage:true, type, ...data}, "*");

    function fitHeight(value) {
      const parsed = Number(value);
      requestedHeight = Number.isFinite(parsed) ? Math.max(720, Math.min(parsed, 1400)) : 920;
      document.documentElement.style.height = requestedHeight + "px";
      document.body.style.height = requestedHeight + "px";
      iframe.style.height = requestedHeight + "px";
      send(SET_HEIGHT, {height: requestedHeight});
    }

    function setImportant(node, styles) {
      if (!node) return;
      Object.entries(styles).forEach(([key, value]) => {
        const cssKey = key.replace(/[A-Z]/g, letter => "-" + letter.toLowerCase());
        node.style.setProperty(cssKey, value, "important");
      });
    }

    function enforceInlineLayout(doc) {
      if (applying) return;
      applying = true;
      try {
        const width = Math.max(680, iframe.clientWidth || 1000);
        const compact = width < 980;
        const headerHeight = compact ? "72px" : "82px";
        const header = doc.querySelector("body > header#stable-topbar") || doc.querySelector("header.stable-topbar") || doc.querySelector("header");
        const left = header && header.querySelector(":scope > .header-logos-left");
        const controls = header && (header.querySelector(":scope > .stable-controls") || header.querySelector(":scope > .controls"));
        const right = header && header.querySelector(":scope > .header-logos-right");
        const tabs = doc.querySelector("body > nav.tabs") || doc.querySelector("nav.tabs") || doc.querySelector(".tabs");
        const spacer = doc.getElementById("tpi-fixed-topbar-spacer");

        setImportant(header, {
          position:"relative", top:"auto", left:"auto", right:"auto", inset:"auto",
          width:"100%", maxWidth:"100%", minWidth:"0", height:headerHeight,
          minHeight:headerHeight, maxHeight:headerHeight, margin:"0", boxSizing:"border-box",
          padding:compact ? "5px 7px" : "7px 10px", display:"grid",
          gridTemplateColumns:"auto minmax(0,1fr) auto", gridTemplateRows:"1fr",
          alignItems:"center", columnGap:compact ? "5px" : "9px", overflow:"hidden",
          zIndex:"20", transform:"none", contain:"none", isolation:"auto"
        });
        setImportant(left, {gridColumn:"1", gridRow:"1", display:"flex", alignItems:"center", justifyContent:"flex-start", gap:compact ? "3px" : "5px", flexWrap:"nowrap", minWidth:"0", maxWidth:"100%", overflow:"hidden", position:"static", transform:"none", margin:"0", padding:"0"});
        setImportant(controls, {gridColumn:"2", gridRow:"1", display:"grid", gridTemplateColumns:compact ? "minmax(160px,1fr) 112px" : "minmax(220px,1fr) 148px", alignItems:"center", justifyContent:"stretch", gap:compact ? "5px" : "8px", width:"100%", minWidth:"0", maxWidth:compact ? "350px" : "480px", justifySelf:"center", overflow:"hidden", position:"static", transform:"none", margin:"0", padding:"0", whiteSpace:"nowrap"});
        setImportant(right, {gridColumn:"3", gridRow:"1", display:"flex", alignItems:"center", justifyContent:"flex-end", gap:compact ? "3px" : "5px", flexWrap:"nowrap", minWidth:"0", maxWidth:"100%", overflow:"hidden", position:"static", transform:"none", margin:"0", padding:"0"});
        setImportant(tabs, {position:"relative", top:"auto", left:"auto", right:"auto", width:"100%", maxWidth:"100%", minWidth:"0", height:"48px", minHeight:"48px", maxHeight:"48px", margin:"0", padding:"7px 10px", boxSizing:"border-box", display:"flex", flexWrap:"nowrap", alignItems:"center", gap:"6px", overflowX:"auto", overflowY:"hidden", transform:"none", contain:"none", isolation:"auto"});
        setImportant(spacer, {display:"none", height:"0", minHeight:"0", maxHeight:"0", margin:"0", padding:"0", flex:"0 0 0"});
      } finally {
        applying = false;
      }
    }

    function applyDashboardLayout() {
      const doc = iframe.contentDocument;
      if (!doc || !doc.head || !doc.body) return;

      let style = doc.getElementById("streamlit-collision-proof-layout");
      if (!style) {
        style = doc.createElement("style");
        style.id = "streamlit-collision-proof-layout";
        style.textContent = `
          :root {
            --stable-header-height:0px !important;
            --stable-tabs-height:0px !important;
            --tpi-locked-header-h:0px !important;
            --tpi-locked-tabs-h:0px !important;
            --tpi-locked-top-h:0px !important;
          }
          html,body { width:100% !important; max-width:100% !important; min-width:0 !important; overflow-x:hidden !important; scroll-padding-top:0 !important; background:#f6f1e8 !important; }
          html body #tpi-fixed-topbar-spacer { display:none !important; height:0 !important; min-height:0 !important; max-height:0 !important; margin:0 !important; padding:0 !important; }
          html body > header#stable-topbar,
          html body > header.stable-topbar,
          html body > header {
            background:linear-gradient(120deg,#071612 0%,#143e34 52%,#1d5f4d 72%,#671818 100%) !important;
            border-bottom:4px solid #a53a3a !important;
            box-shadow:0 11px 28px rgba(15,23,42,.38) !important;
          }
          html body > header#stable-topbar .header-logo-card {
            display:inline-flex !important; flex:0 0 auto !important; box-sizing:border-box !important;
            height:52px !important; min-height:52px !important; width:72px !important; min-width:72px !important; max-width:72px !important;
            padding:4px 6px !important; border:2px solid rgba(255,255,255,.94) !important; border-radius:11px !important;
            background:#fff !important; box-shadow:0 6px 15px rgba(0,0,0,.26) !important; overflow:hidden !important;
          }
          html body > header#stable-topbar .header-logo-card img { width:auto !important; height:auto !important; max-width:62px !important; max-height:40px !important; object-fit:contain !important; }
          html body > header#stable-topbar .tpi-main { width:104px !important; min-width:104px !important; max-width:104px !important; }
          html body > header#stable-topbar .tpi-main img { max-width:94px !important; max-height:41px !important; }
          html body > header#stable-topbar .stable-eu-card { width:86px !important; min-width:86px !important; max-width:86px !important; }
          html body > header#stable-topbar .stable-ministry-card { width:106px !important; min-width:106px !important; max-width:106px !important; }
          html body > header#stable-topbar .stable-ministry-card img { max-width:96px !important; }
          html body > header#stable-topbar .logo-with-label { flex-direction:column !important; gap:1px !important; }
          html body > header#stable-topbar .logo-with-label .support-label { display:block !important; font-size:6.5px !important; line-height:1 !important; margin:0 !important; white-space:nowrap !important; }

          html body > header#stable-topbar .stable-year-control,
          html body > header#stable-topbar .stable-basis-control {
            height:50px !important; min-height:50px !important; max-height:50px !important; width:100% !important; min-width:0 !important; max-width:none !important;
            box-sizing:border-box !important; margin:0 !important; padding:5px 7px !important;
            border:1px solid rgba(255,255,255,.45) !important; border-radius:11px !important;
            background:rgba(255,255,255,.16) !important; box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 12px rgba(0,0,0,.18) !important;
            overflow:hidden !important;
          }
          html body > header#stable-topbar .stable-year-control { display:grid !important; grid-template-columns:34px minmax(0,1fr) !important; align-items:center !important; gap:5px !important; }
          html body > header#stable-topbar .stable-basis-control { display:grid !important; grid-template-columns:48px minmax(0,1fr) !important; align-items:center !important; gap:4px !important; }
          html body > header#stable-topbar .stable-control-title,
          html body > header#stable-topbar label { color:#fff !important; font-size:7px !important; line-height:1.05 !important; font-weight:900 !important; letter-spacing:.02em !important; white-space:normal !important; text-align:center !important; text-shadow:0 1px 2px rgba(0,0,0,.45) !important; }
          html body > header#stable-topbar #year-filter-wrap.stable-year-wrap,
          html body > header#stable-topbar #year-filter-wrap {
            display:grid !important; grid-template-columns:minmax(0,1fr) !important; grid-template-rows:18px 8px 10px !important; row-gap:1px !important;
            width:100% !important; min-width:0 !important; max-width:none !important; height:39px !important; min-height:39px !important; max-height:39px !important;
            margin:0 !important; padding:0 !important; overflow:hidden !important; flex:1 1 auto !important;
          }
          html body > header#stable-topbar #year-slider,
          html body > header#stable-topbar #year-ticks,
          html body > header#stable-topbar #year-selected-label {
            width:100% !important; min-width:0 !important; max-width:none !important; margin:0 !important; padding:0 !important;
          }
          html body > header#stable-topbar #year-slider { height:18px !important; }
          html body > header#stable-topbar #year-ticks { height:8px !important; display:flex !important; justify-content:space-between !important; overflow:hidden !important; }
          html body > header#stable-topbar #year-ticks span { font-size:5.5px !important; line-height:1 !important; margin:0 !important; padding:0 !important; }
          html body > header#stable-topbar #year-selected-label { height:10px !important; font-size:7px !important; line-height:1 !important; text-align:center !important; overflow:hidden !important; }
          html body > header#stable-topbar .stable-toggle-pill,
          html body > header#stable-topbar .toggle-pill { display:flex !important; align-items:center !important; width:100% !important; min-width:0 !important; max-width:none !important; gap:2px !important; padding:2px !important; overflow:hidden !important; }
          html body > header#stable-topbar .stable-toggle-pill button,
          html body > header#stable-topbar .toggle-pill button { flex:1 1 0 !important; min-width:0 !important; max-width:none !important; padding:6px 3px !important; font-size:8px !important; line-height:1 !important; white-space:nowrap !important; }

          html body > nav.tabs,
          html body nav.tabs,
          html body .tabs { background:linear-gradient(90deg,#551515 0%,#7a1f1f 56%,#4c1313 100%) !important; box-shadow:0 8px 20px rgba(26,26,26,.22) !important; }
          html body #tpi-acronym-button { margin:0 8px 0 0 !important; flex:0 0 auto !important; }
          html body > nav.tabs > .tab,
          html body nav.tabs > .tab { flex:0 0 auto !important; height:32px !important; padding:0 12px !important; font-size:9.5px !important; white-space:nowrap !important; }
          html body main { width:100% !important; max-width:none !important; min-width:0 !important; margin:0 !important; padding:18px 13px 56px !important; overflow:visible !important; }
          .metrics-grid,.two-col,.three-col { min-width:0 !important; }
          .tbl-wrap,.table-wrap,.table-scroller,.data-table-wrap { max-width:100% !important; overflow:auto !important; }
          .chart-box,[id^="chart-"],[id^="kd-chart-"] { max-width:100% !important; min-width:0 !important; }

          @media (max-width:980px) {
            html body > header#stable-topbar .header-logo-card { height:46px !important; min-height:46px !important; width:58px !important; min-width:58px !important; max-width:58px !important; padding:3px 4px !important; }
            html body > header#stable-topbar .header-logo-card img { max-width:50px !important; max-height:35px !important; }
            html body > header#stable-topbar .tpi-main { width:82px !important; min-width:82px !important; max-width:82px !important; }
            html body > header#stable-topbar .tpi-main img { max-width:74px !important; max-height:36px !important; }
            html body > header#stable-topbar .stable-eu-card { width:66px !important; min-width:66px !important; max-width:66px !important; }
            html body > header#stable-topbar .stable-ministry-card { width:80px !important; min-width:80px !important; max-width:80px !important; }
            html body > header#stable-topbar .stable-ministry-card img { max-width:72px !important; }
            html body > header#stable-topbar .logo-with-label .support-label { font-size:5.5px !important; }
            html body > header#stable-topbar .stable-year-control,
            html body > header#stable-topbar .stable-basis-control { height:46px !important; min-height:46px !important; max-height:46px !important; padding:4px !important; }
            html body > header#stable-topbar .stable-year-control { grid-template-columns:26px minmax(0,1fr) !important; gap:3px !important; }
            html body > header#stable-topbar .stable-basis-control { grid-template-columns:35px minmax(0,1fr) !important; gap:2px !important; }
            html body > header#stable-topbar .stable-control-title { font-size:6px !important; }
            html body > header#stable-topbar .stable-toggle-pill button { font-size:7px !important; padding:5px 2px !important; }
          }
          @media (max-width:700px) {
            html,body { overflow-x:auto !important; }
            html body > header#stable-topbar,
            html body > header.stable-topbar,
            html body > header,
            html body > nav.tabs,
            html body nav.tabs,
            html body main { min-width:680px !important; }
          }
        `;
        doc.head.appendChild(style);
      }

      enforceInlineLayout(doc);
      if (!headerObserver) {
        const header = doc.querySelector("body > header#stable-topbar") || doc.querySelector("header.stable-topbar") || doc.querySelector("header");
        if (header) {
          headerObserver = new MutationObserver(() => requestAnimationFrame(() => enforceInlineLayout(doc)));
          headerObserver.observe(header, {attributes:true, attributeFilter:["style","class"], childList:false, subtree:false});
        }
      }
      try {
        iframe.contentWindow.dispatchEvent(new Event("resize"));
        if (iframe.contentWindow.Plotly) {
          doc.querySelectorAll(".js-plotly-plot").forEach(node => { try { iframe.contentWindow.Plotly.Plots.resize(node); } catch(_) {} });
        }
      } catch(_) {}
    }

    window.addEventListener("message", event => {
      const data = event.data || {};
      if (data.type === RENDER) {
        fitHeight((data.args || {}).requested_height || requestedHeight);
        [0,250,800,1800].forEach(ms => setTimeout(applyDashboardLayout, ms));
      }
    });
    iframe.addEventListener("load", () => {
      loading.style.display = "none";
      [0,250,800,1800].forEach(ms => setTimeout(applyDashboardLayout, ms));
      fitHeight(requestedHeight);
    });
    window.addEventListener("resize", () => { fitHeight(requestedHeight); applyDashboardLayout(); });
    document.addEventListener("DOMContentLoaded", () => { send(READY,{apiVersion:1}); fitHeight(requestedHeight); });
    setTimeout(() => { send(READY,{apiVersion:1}); fitHeight(requestedHeight); },200);
  })();
  </script>
</body>
</html>
